---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: replicaobservations.agent.modelplane.ai
spec:
  group: agent.modelplane.ai
  names:
    categories:
    - modelplane
    kind: ReplicaObservation
    listKind: ReplicaObservationList
    plural: replicaobservations
    singular: replicaobservation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Scheduled')].status
      name: SCHEDULED
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A ReplicaObservation reports the state of one replica's pods and the devices
          they were allocated. The agent writes its status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReplicaObservationSpec specifies which pods make up the replica.
            properties:
              podSelector:
                description: |-
                  PodSelector selects the replica's pods in the ReplicaObservation's
                  namespace. The agent only sees pods that carry a modelplane.ai/replica
                  label, so a selector that matches other pods matches nothing.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
            - podSelector
            type: object
          status:
            description: ReplicaObservationStatus is what the agent observed about
              the replica.
            properties:
              conditions:
                description: |-
                  Conditions of the replica. Scheduled is True when every pod is bound to
                  a node and the agent has seen each pod's ResourceClaims allocated. Ready
                  is True when every pod is ready, and otherwise its reason says what the
                  replica is waiting on. Each condition's lastTransitionTime is when its
                  status last changed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              devices:
                description: Devices are the DRA devices allocated to the replica's
                  pods.
                items:
                  description: An AllocatedDevice is a DRA device allocated to one
                    of a replica's pods.
                  properties:
                    device:
                      description: Device is the device's name within its DRA pool.
                      maxLength: 63
                      type: string
                    driver:
                      description: Driver that publishes the device.
                      maxLength: 63
                      type: string
                    nodeName:
                      description: |-
                        NodeName is the node the device is attached to. It's omitted for a
                        device that isn't attached to one node, like a network-attached device,
                        or that no ResourceSlice currently publishes.
                      maxLength: 253
                      type: string
                    pool:
                      description: |-
                        Pool is the DRA resource pool the device belongs to. This is the
                        driver's pool, not a Modelplane GPU pool.
                      maxLength: 253
                      type: string
                    uuid:
                      description: UUID is the device's uuid attribute, when the driver
                        publishes one.
                      maxLength: 64
                      type: string
                  required:
                  - device
                  - driver
                  - pool
                  type: object
                maxItems: 4096
                type: array
                x-kubernetes-list-map-keys:
                - driver
                - pool
                - device
                x-kubernetes-list-type: map
              lastTermination:
                description: |-
                  LastTermination is the most recent termination of one of the replica's
                  containers that the kubelet then restarted, like an engine that was
                  OOMKilled. It's omitted when no container has restarted. It's only as
                  recent as the replica's current pods: a pod that's replaced takes its
                  containers' terminations with it.
                properties:
                  container:
                    description: Container that terminated.
                    maxLength: 63
                    type: string
                  exitCode:
                    description: ExitCode of the container's last process.
                    format: int32
                    type: integer
                  finishedAt:
                    description: FinishedAt is when the container terminated.
                    format: date-time
                    type: string
                  pod:
                    description: Pod the container belongs to.
                    maxLength: 253
                    type: string
                  reason:
                    description: Reason the container terminated, like OOMKilled or
                      Error.
                    maxLength: 1024
                    type: string
                required:
                - container
                - exitCode
                - finishedAt
                - pod
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation of the spec the
                  status reports on.
                format: int64
                type: integer
              pods:
                description: Pods counts the replica's pods.
                properties:
                  ready:
                    description: Ready counts the pods whose Ready condition is True.
                    format: int32
                    minimum: 0
                    type: integer
                  restarts:
                    description: |-
                      Restarts counts the times the kubelet restarted the pods' containers,
                      init containers included. Like a pod's restart counts, it only counts
                      restarts of the current pods.
                    format: int32
                    minimum: 0
                    type: integer
                  scheduled:
                    description: Scheduled counts the pods bound to a node.
                    format: int32
                    minimum: 0
                    type: integer
                  total:
                    description: |-
                      Total counts the pods the replica's selector matches that haven't
                      run to completion. A pod that has succeeded or failed, like an evicted
                      one, doesn't count.
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - ready
                - scheduled
                - total
                type: object
              pools:
                description: |-
                  Pools are the pools whose nodes the replica's devices are attached to,
                  with when the agent first saw the latest of the replica's ResourceClaims
                  that hold devices on each allocated.
                items:
                  description: |-
                    An AllocatedPool is a pool whose nodes some of a replica's devices are
                    attached to.
                  properties:
                    lastAllocationTime:
                      description: |-
                        LastAllocationTime is the latest time the agent first saw one of the
                        replica's ResourceClaims that hold devices on the pool allocated. The
                        pool's PoolObservation accounts for those devices once its own
                        lastAllocationTime is no earlier than this, unless they've since been
                        deallocated.
                      format: date-time
                      type: string
                    name:
                      description: 'Name of the pool: its nodes'' modelplane.ai/pool
                        label.'
                      maxLength: 63
                      type: string
                  required:
                  - lastAllocationTime
                  - name
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - pods
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
