---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: poolobservations.agent.modelplane.ai
spec:
  group: agent.modelplane.ai
  names:
    categories:
    - modelplane
    kind: PoolObservation
    listKind: PoolObservationList
    plural: poolobservations
    singular: poolobservation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolName
      name: POOL
      type: string
    - jsonPath: .status.conditions[?(@.type=='Healthy')].status
      name: HEALTHY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A PoolObservation reports the state of one pool: the nodes that carry a
          modelplane.ai/pool label with the pool's name. The agent writes its status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PoolObservationSpec specifies which pool to observe.
            properties:
              poolName:
                description: |-
                  PoolName is the pool's name: the value of its nodes' modelplane.ai/pool
                  label, and of the node selector that pins a pod to the pool. It can't be
                  changed.
                maxLength: 63
                minLength: 1
                pattern: ^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: poolName is immutable
                  rule: self == oldSelf
            required:
            - poolName
            type: object
          status:
            description: PoolObservationStatus is what the agent observed about the
              pool.
            properties:
              conditions:
                description: |-
                  Conditions of the pool. Healthy is False when any of the pool's nodes
                  is not ready or cordoned, or any of its devices is tainted.
                  ScaleUpBlocked is True when the cluster autoscaler reports it can't add
                  nodes for an unschedulable pod. Both are Unknown, and the status reports
                  no nodes or devices, when the agent can't observe the pool. Each
                  condition's lastTransitionTime is when its status last changed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              devices:
                description: |-
                  Devices are the DRA devices the pool's nodes publish, by the
                  DeviceClass they belong to. A device that belongs to more than one
                  DeviceClass counts toward each.
                items:
                  description: DeviceClassStatus describes a pool's devices of one
                    DeviceClass.
                  properties:
                    allocatable:
                      description: Allocatable counts the class's untainted devices
                        on schedulable nodes.
                      format: int32
                      minimum: 0
                      type: integer
                    allocated:
                      description: Allocated counts the allocatable devices a ResourceClaim
                        has allocated.
                      format: int32
                      minimum: 0
                      type: integer
                    attributes:
                      additionalProperties:
                        description: DeviceAttribute must have exactly one field set.
                        properties:
                          bool:
                            description: BoolValue is a true/false value.
                            type: boolean
                          bools:
                            description: BoolValues is a non-empty list of true/false
                              values.
                            items:
                              type: boolean
                            type: array
                            x-kubernetes-list-type: atomic
                          int:
                            description: IntValue is a number.
                            format: int64
                            type: integer
                          ints:
                            description: |-
                              IntValues is a non-empty list of numbers.

                              This is an alpha field and requires enabling the DRAListTypeAttributes feature gate.
                            items:
                              format: int64
                              type: integer
                            type: array
                            x-kubernetes-list-type: atomic
                          string:
                            description: StringValue is a string. Must not be longer
                              than 64 characters.
                            type: string
                          strings:
                            description: |-
                              StringValues is a non-empty list of strings.
                              Each string must not be longer than 64 characters.

                              This is an alpha field and requires enabling the DRAListTypeAttributes feature gate.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          version:
                            description: |-
                              VersionValue is a semantic version according to semver.org spec 2.0.0.
                              Must not be longer than 64 characters.
                            type: string
                          versions:
                            description: |-
                              VersionValues is a non-empty list of semantic versions according to semver.org spec 2.0.0.
                              Each version string must not be longer than 64 characters.

                              This is an alpha field and requires enabling the DRAListTypeAttributes feature gate.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        type: object
                      description: |-
                        Attributes are the device attributes every device of the class in the
                        pool agrees on, keyed by the attribute names the DRA driver publishes.
                      maxProperties: 32
                      type: object
                    deviceClassName:
                      description: DeviceClassName is the DeviceClass the devices
                        belong to.
                      maxLength: 253
                      type: string
                    nodes:
                      description: |-
                        Nodes counts the pool's nodes that publish at least one device of the
                        class, whatever their state.
                      format: int32
                      minimum: 0
                      type: integer
                  required:
                  - allocatable
                  - allocated
                  - deviceClassName
                  - nodes
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - deviceClassName
                x-kubernetes-list-type: map
              extendedResources:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: |-
                  ExtendedResources sums the extended resources, such as nvidia.com/gpu,
                  that the pool's nodes advertise as allocatable. A device plugin
                  advertises these. One advertising the same hardware a DRA driver
                  publishes gives the two allocators separate books over one set of
                  devices.
                maxProperties: 64
                type: object
              lastAllocationTime:
                description: |-
                  LastAllocationTime is the latest time the agent first saw a ResourceClaim
                  allocated devices on the pool's nodes. It never goes back. The agent
                  observes the pool from a view of the cluster that includes every claim it
                  saw allocated at or before this time, unless the claim has since been
                  deallocated. So NodesByFreeDevices accounts for the devices of a
                  ReplicaObservation whose lastAllocationTime for the pool is no later than
                  this, unless they've since been deallocated.
                format: date-time
                type: string
              nodes:
                description: Nodes counts the pool's nodes.
                properties:
                  ready:
                    description: Ready counts the nodes whose Ready condition is True.
                    format: int32
                    minimum: 0
                    type: integer
                  schedulable:
                    description: Schedulable counts the ready nodes that aren't cordoned.
                    format: int32
                    minimum: 0
                    type: integer
                  total:
                    description: Total counts every node in the pool.
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - ready
                - schedulable
                - total
                type: object
              nodesByFreeDevices:
                description: |-
                  NodesByFreeDevices is a histogram of the pool's schedulable nodes, by
                  how many devices of each DeviceClass are allocatable and not allocated
                  on them. Nodes with the same number of free devices of every class
                  share a bucket.
                items:
                  description: A FreeDevicesBucket counts the nodes with the same
                    free devices.
                  properties:
                    freeDevices:
                      additionalProperties:
                        format: int32
                        type: integer
                      description: |-
                        FreeDevices counts each of the nodes' free devices, keyed by
                        DeviceClass. A class the nodes publish no devices of is absent.
                      maxProperties: 32
                      type: object
                    nodes:
                      description: Nodes counts the nodes with these free devices.
                      format: int32
                      minimum: 1
                      type: integer
                  required:
                  - nodes
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: ObservedGeneration is the generation of the spec the
                  status reports on.
                format: int64
                type: integer
              unschedulablePods:
                description: |-
                  UnschedulablePods counts the pods pinned to the pool by a
                  modelplane.ai/pool node selector that the scheduler couldn't find a
                  node for. Only pods that carry a modelplane.ai/replica label count.
                format: int32
                minimum: 0
                type: integer
            required:
            - nodes
            - unschedulablePods
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
