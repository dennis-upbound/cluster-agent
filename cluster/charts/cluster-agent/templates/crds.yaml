{{- /*
Helm installs the CRDs in a chart's crds directory but never upgrades them, so
the chart templates its CRDs instead. controller-gen generates them in
files/crds.
*/ -}}
{{- if .Values.crds.enabled }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $_ := set $crd.metadata "labels" (include "cluster-agent.labels" $ | fromYaml) }}
{{- if $.Values.crds.keep }}
{{- $_ := set $crd.metadata "annotations" (merge (dict "helm.sh/resource-policy" "keep") ($crd.metadata.annotations | default dict)) }}
{{- end }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
